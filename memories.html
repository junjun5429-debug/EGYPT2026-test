<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta name="theme-color" content="#f7f4ef">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>思い出フォト | Egypt 2026 test</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
  </style>
  <link rel="stylesheet" href="memories.css?v=20260821-6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" defer></script>
  <script src="memories.js?v=20260821-11" defer></script>
</head>
<body>
  <header class="album-header">
    <nav class="album-nav" aria-label="思い出フォト ナビゲーション">
      <a class="brand" href="index.html"><span>EGYPT</span><small>2026 TEST</small></a>
      <a class="back-link" href="index.html">旅のしおりへ戻る</a>
    </nav>
    <div class="test-site-banner" role="note">テスト用ミラーサイト</div>
    <div class="album-intro">
      <p class="eyebrow">TRAVEL MEMORIES</p>
      <h1>旅の一瞬を、<br>自分のアルバムへ。</h1>
      <p>写真と日付、場所、ひとことを一緒に残せます。</p>
    </div>
  </header>

  <main class="album-main">
    <section class="auth-panel" id="auth-panel" aria-labelledby="auth-title">
      <div>
        <p class="eyebrow">MEMBER SIGN IN</p>
        <h2 id="auth-title">アルバムをひらく</h2>
      </div>
      <div class="nickname-login" id="nickname-login" role="group" aria-label="ログインするニックネーム">
        <button class="nickname-button" type="button" data-nickname="junpei">JUNPEI</button>
        <button class="nickname-button" type="button" data-nickname="kazuki">KAZUKI</button>
        <button class="nickname-button" type="button" data-nickname="takuya">TAKUYA</button>
      </div>
      <div class="credential-panel" id="credential-panel" hidden>
        <button class="text-button auth-back" type="button" id="auth-back-button">← ユーザーを選び直す</button>
        <p class="selected-nickname" id="selected-nickname"></p>
        <h3 id="credential-title"></h3>
        <form class="credential-form" id="credential-form">
          <label id="auth-email-field">メール アドレス<input id="auth-email" type="email" inputmode="email" autocomplete="email" required></label>
          <label><span id="auth-password-label">パスワード</span><input id="auth-password" type="password" minlength="8" autocomplete="current-password" required></label>
          <button class="primary-button" id="auth-submit-button" type="submit"></button>
        </form>
        <button class="text-button auth-mode-button" type="button" id="auth-mode-button"></button>
        <button class="text-button auth-mode-button" type="button" id="password-reset-button">パスワードを忘れた方</button>
      </div>
      <p class="status-message" id="auth-message" aria-live="polite"></p>
    </section>

    <section class="album-workspace" id="album-workspace" hidden>
      <div class="account-bar">
        <div class="account-identity">
          <span class="online-indicator" aria-hidden="true"></span>
          <div class="account-copy"><span>ログイン中のユーザー</span><strong id="account-email"></strong></div>
        </div>
        <button class="text-button" type="button" id="sign-out-button">ログアウト</button>
      </div>

      <section class="upload-panel" aria-labelledby="upload-title">
        <div class="section-heading">
          <div><p class="eyebrow">ADD A MEMORY</p><h2 id="upload-title">写真を追加</h2></div>
          <span class="upload-limit">JPEG・PNG・WebP / 10 MBまで・1枚1 MB以下に自動圧縮</span>
        </div>
        <form class="upload-form" id="upload-form">
          <label class="photo-picker" for="photo-file">
            <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" multiple required>
            <div class="photo-preview-grid" id="photo-preview-grid" aria-label="選択した写真" hidden></div>
            <span class="photo-selection-summary" id="photo-selection-summary" hidden></span>
            <span id="photo-prompt"><strong>写真を選択</strong><small>複数選択できます</small></span>
          </label>
          <div class="memory-fields">
            <label>撮影日（任意）<input id="memory-date" type="date"></label>
            <div class="location-filter">
              <label>場所（任意）<input id="memory-location" type="text" maxlength="80" placeholder="例：ギザの三大ピラミッド"></label>
              <div class="location-suggestions" id="memory-location-suggestions" aria-label="保存済みの場所"></div>
            </div>
            <label class="wide-field">コメント (任意)<textarea id="memory-comment" maxlength="500" rows="4" placeholder="この日の思い出"></textarea></label>
            <button class="primary-button wide-field" id="upload-button" type="submit">アルバムに保存</button>
          </div>
        </form>
        <p class="status-message" id="upload-message" aria-live="polite"></p>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-heading gallery-heading">
          <div><p class="eyebrow">MY ALBUM</p><h2 id="gallery-title">思い出一覧</h2></div>
          <span id="memory-count">0枚</span>
        </div>
        <div class="album-scope">
          <label class="scope-switch">
            <input id="show-others" type="checkbox">
            <span class="scope-track" aria-hidden="true"></span>
            <span class="scope-text">ほかのメンバーの写真も表示</span>
          </label>
        </div>
        <div class="filters" aria-label="思い出を絞り込む">
          <label>撮影日<input id="filter-date" type="date"></label>
          <div class="location-filter">
            <label>場所<input id="filter-location" type="search" placeholder="場所を検索"></label>
            <div class="location-suggestions" id="location-suggestions" aria-label="保存済みの場所"></div>
          </div>
          <button class="secondary-button" type="button" id="clear-filters">条件をクリア</button>
        </div>
        <div class="selection-bar" id="selection-bar" hidden>
          <span id="selection-count">0枚を選択中</span>
          <button class="danger-button" type="button" id="delete-selected-button">選択した写真を削除</button>
        </div>
        <p class="gallery-status" id="gallery-status" aria-live="polite">読み込み中</p>
        <div class="memory-grid" id="memory-grid"></div>
      </section>
    </section>
  </main>

  <dialog class="photo-dialog" id="photo-dialog">
    <button class="dialog-close" type="button" id="photo-dialog-close" aria-label="拡大表示を閉じる">×</button>
    <img id="dialog-image" alt="">
    <div class="dialog-caption">
      <strong id="dialog-location"></strong><span id="dialog-date"></span><span id="dialog-author" class="dialog-author"></span><p id="dialog-comment"></p>
      <button class="secondary-button" type="button" id="photo-edit-button">詳細を編集</button>
    </div>
  </dialog>

  <dialog class="edit-dialog" id="edit-dialog">
    <form id="edit-form">
      <div class="dialog-heading"><h2>思い出を編集</h2><button class="dialog-close inline" type="button" id="edit-dialog-close" aria-label="編集を閉じる">×</button></div>
      <input id="edit-id" type="hidden">
      <label>撮影日（任意）<input id="edit-date" type="date"></label>
      <label>場所（任意）<input id="edit-location" type="text" maxlength="80"></label>
      <label>コメント (任意)<textarea id="edit-comment" maxlength="500" rows="5"></textarea></label>
      <div class="button-row"><button class="primary-button" type="submit">変更を保存</button><button class="danger-button" type="button" id="delete-button">写真を削除</button></div>
      <p class="status-message" id="edit-message" aria-live="polite"></p>
    </form>
  </dialog>
</body>
</html>
